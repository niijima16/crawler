server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # ログイン情報を画面のメモリに持つため、外部スクリプトの読み込みを禁止する
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # バックエンドの制限時間（上限 120 秒）より長くする
    proxy_read_timeout 150s;
    # SSE（引き継ぎ進捗）をバッファせず都度流す。小さな JSON 応答には影響しない
    proxy_buffering off;
  }

  location / {
    try_files $uri /index.html;
  }
}
