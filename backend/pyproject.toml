[project]
name = "spider"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.27",
    "playwright>=1.65.2",
    "pydantic>=2",
    "smooth-cursor-playwright>=0.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spider"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100
# global_utils は本体（spider）とは別の実験用スクリプト置き場。機械チェックの対象外。
extend-exclude = ["global_utils"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["spider", "test"]
exclude = ["global_utils"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# smooth-cursor-playwright は型情報（py.typed）を持たない
module = ["human_cursor.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["global_utils.*"]
follow_imports = "skip"
